server:
  port: 8090

spring:
  application:
    name: legacy-catalog-adapter
  mvc:
    problemdetails:
      enabled: true

bookstore:
  legacy:
    # Địa chỉ dịch vụ SOAP kế thừa; ghi đè bằng biến môi trường BOOKSTORE_LEGACY_ENDPOINT
    endpoint: http://localhost:8091/ws/catalog
    connect-timeout: 2s
    read-timeout: 3s
    log-messages: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    vn.edu.bookstore.legacy.adapter.soap.SoapLoggingHandler: INFO
